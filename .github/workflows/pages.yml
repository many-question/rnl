# Publishes the introduction page in site/ to GitHub Pages.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publish only the page itself, plus the portable package as downloads;
      # site/README.md and site/package.py stay in the repository.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/index.html site/assets _site/
          python3 site/package.py _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
